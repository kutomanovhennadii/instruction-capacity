# The checks of a reader on every push: the pinned environment, the tests of the package, the
# vocabularies against their references and every published measurement recomputed and verified.
name: checks

on:
  push:
  pull_request:

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install the pinned environment and the package
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps .
          python -m pip install -r requirements-test.txt
      - name: Tests
        run: python -m pytest -q
      - name: Vocabularies
        run: python scripts/verify_vocab.py
      - name: Published measurements
        run: |
          for measurement in artefacts/*/; do
            python scripts/verify.py "$measurement"
          done
