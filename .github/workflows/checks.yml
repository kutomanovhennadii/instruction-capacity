# The checks of a reader on every push: the pinned environment, the tests of the package, the
# vocabularies against their references and every published measurement recomputed and verified,
# one job per measurement, so that every one fits the time limit of a job.
name: checks

on:
  push:
  pull_request:

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install the pinned environment and the package
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps .
          python -m pip install -r requirements-test.txt
      - name: Tests
        run: python -m pytest -q
      - name: Vocabularies
        run: python scripts/verify_vocab.py

  measurements:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "names=$(ls artefacts | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  measurement:
    needs: measurements
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.measurements.outputs.names) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the pinned environment and the package
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps .
      - name: Recompute and verify
        run: |
          set -o pipefail
          python scripts/verify.py "artefacts/${{ matrix.name }}" 2>&1 | tee verify.log
      - name: Show the end of a failed check
        if: failure()
        run: tail -n 10 verify.log | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
